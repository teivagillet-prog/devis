<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devis à la voix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {
                colors: { obsidian: '#070A0F', charcoal: '#0F1522', cardDark: '#131B2A', gold: { 400: '#E6C687', 500: '#D4AF37', 600: '#AA820A' } },
                fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
            } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { background-color: #070A0F; color: #E2E8F0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .gold-gradient-text { background: linear-gradient(135deg, #FFF5D6 0%, #D4AF37 50%, #AA820A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel { background: rgba(19, 27, 42, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        #micro { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    </style>
</head>
<body class="min-h-screen">

    <header class="border-b border-white/10 glass-panel">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-gold-400 via-gold-500 to-amber-600 flex items-center justify-center"><i data-lucide="cpu" class="w-5 h-5 text-black"></i></div>
                <span class="font-bold text-white">Vos <span class="gold-gradient-text font-serif italic">Automatisations</span></span>
            </div>
            <div id="barre-fiche" class="flex items-center gap-2 text-xs"></div>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pb-48">
        <div class="pt-6 pb-2">
            <h1 id="titre-parcours" class="text-2xl font-serif font-bold text-white"></h1>
            <p id="sous-titre" class="text-slate-400 text-sm mt-1"></p>
        </div>

        <!-- Le micro unique, toujours visible en haut -->
        <section id="zone-micro" class="sticky top-0 z-30 -mx-4 px-4 py-4 glass-panel border-b border-gold-500/20 text-center">
            <button type="button" id="micro" onclick="toucherMicro()" aria-label="Parler"
                class="mx-auto w-24 h-24 rounded-full flex items-center justify-center bg-gradient-to-br from-gold-400 via-gold-500 to-gold-600 text-black shadow-xl shadow-gold-500/30 active:scale-95 transition">
                <i data-lucide="mic" class="w-11 h-11"></i>
            </button>
            <p id="etat" class="mt-3 text-sm font-semibold text-gold-400">Touchez le micro et répondez à la question</p>
            <p id="question-courante" class="mt-1 text-white text-base"></p>
            <p class="mt-1 text-[11px] text-slate-500">Dites « passer » pour sauter, « question précédente » pour revenir. Trompé ? Dites « pardon » puis la bonne réponse.</p>
        </section>

        <div id="aide-navigateur" class="mt-4"></div>
        <div id="cartes" class="mt-4 space-y-3"></div>
        <div id="fin-zone" class="mt-4"></div>

        <p class="mt-10 text-center text-[11px] text-slate-600">Vos informations restent sur votre téléphone. · v6</p>
    </main>
    <div id="barre-pdf" class="hidden fixed bottom-0 inset-x-0 z-40 glass-panel border-t border-gold-500/30 px-4 pt-3 pb-5">
        <div class="max-w-xl mx-auto">
            <p id="barre-pdf-info" class="text-xs text-center mb-2"></p>
            <button type="button" id="barre-pdf-bouton" onclick="actionBarrePdf()" class="w-full px-6 py-4 rounded-full text-base font-bold text-black bg-gradient-to-r from-gold-400 to-gold-600 transition"></button>
        </div>
    </div>
    <main class="hidden">
    </main>

    <script>
        /* ===================== PDF DU DEVIS (jsPDF, sans IA) ===================== */
        function nombre(v) {
            var s = String(v == null ? '' : v).replace(/\s/g, '').replace(/[€a-zA-Z]/g, '').replace(',', '.');
            var n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        }

        function euros(n) {
            var neg = n < 0; n = Math.abs(Math.round(n * 100) / 100);
            var p = n.toFixed(2).split('.');
            return (neg ? '-' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + p[1] + ' €';
        }

        function dateFr(d) {
            return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear();
        }

        function sansAccents(t) {
            return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function numeroDevis(d, nomClient) {
            var mots = String(nomClient || 'CLIENT').trim().split(/\s+/);
            var nom = sansAccents(mots[mots.length - 1]).toUpperCase().replace(/[^A-Z0-9-]/g, '') || 'CLIENT';
            return 'DEV-' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + nom;
        }

        function calculerDevis(fiche, devis) {
            var franchise = fiche.regime === 'franchise';
            var taux = franchise ? 0 : nombre(devis.tauxTva);
            var lignes = [], ht = 0;
            for (var i = 0; i < devis.lignes.length; i++) {
                var l = devis.lignes[i];
                var q = nombre(l.qte), pu = nombre(l.pu);
                if (!String(l.designation || '').trim() || q <= 0) continue;
                var tot = Math.round(q * pu * 100) / 100;
                lignes.push({ designation: String(l.designation).trim(), qte: q, unite: l.unite || 'u', pu: pu, total: tot });
                ht += tot;
            }
            ht = Math.round(ht * 100) / 100;
            var tva = Math.round(ht * taux) / 100;
            var ttc = Math.round((ht + tva) * 100) / 100;
            var acompte = Math.round(ttc * nombre(fiche.acompte)) / 100;
            return { franchise: franchise, taux: taux, lignes: lignes, ht: ht, tva: tva, ttc: ttc, acompte: acompte };
        }

        function genererPdfDevis(JsPDF, fiche, devis, aujourdhui) {
            var c = calculerDevis(fiche, devis);
            var doc = new JsPDF({ unit: 'mm', format: 'a4' });
            var MARINE = [31, 58, 95], GRIS = [90, 98, 112], CLAIR = [201, 211, 224];
            var G = 16, D = 194, L = D - G;
            var date = aujourdhui || new Date();
            var fin = new Date(date.getTime()); fin.setDate(fin.getDate() + (Math.round(nombre(fiche.validite)) || 30));
            var numero = numeroDevis(date, devis.clientNom);
            var y;

            function texte(t, x, yy, o) {
                o = o || {};
                doc.setFont('helvetica', o.gras ? 'bold' : 'normal');
                doc.setFontSize(o.taille || 9);
                var col = o.couleur || [0, 0, 0]; doc.setTextColor(col[0], col[1], col[2]);
                var lignesT = Array.isArray(t) ? t : (o.largeur ? doc.splitTextToSize(String(t), o.largeur) : [String(t)]);
                doc.text(lignesT, x, yy, o.droite ? { align: 'right' } : undefined);
                return lignesT.length * (o.taille || 9) * 0.42;
            }
            function place(h) { if (y + h > 285) { doc.addPage(); y = 18; } }

            // En-tête entreprise
            y = 20;
            texte(fiche.nom, G, y, { taille: 16, gras: true }); y += 6;
            var ent = [fiche.forme + (fiche.dirigeant ? ' – ' + fiche.dirigeant : ''), fiche.adresse,
                       [fiche.tel, fiche.email].filter(Boolean).join(' – '),
                       'SIRET ' + fiche.siret + (fiche.rm ? ' – RM ' + fiche.rm : '')];
            if (!c.franchise && fiche.tvaNum) ent.push('TVA intracom. ' + fiche.tvaNum);
            for (var e = 0; e < ent.length; e++) { y += texte(ent[e], G, y, { largeur: 110 }); }
            // En-tête devis
            texte('DEVIS', D, 21, { taille: 22, gras: true, couleur: MARINE, droite: true });
            texte('N° ' + numero, D, 28, { gras: true, droite: true });
            texte('Date : ' + dateFr(date), D, 32, { droite: true });
            texte("Valable jusqu'au : " + dateFr(fin), D, 36, { droite: true });

            // Client
            y = Math.max(y, 40) + 4;
            var cli = [devis.clientNom, devis.clientAdresse, devis.clientContact].filter(function (s) { return String(s || '').trim(); });
            var hCli = 9 + cli.length * 4.6 + (devis.chantier ? 9.5 : 0);
            doc.setDrawColor(MARINE[0], MARINE[1], MARINE[2]); doc.setLineWidth(0.3);
            doc.rect(108, y, D - 108, hCli);
            texte('CLIENT', 112, y + 5.5, { gras: true, couleur: MARINE });
            var yc = y + 10;
            for (var k = 0; k < cli.length; k++) { yc += texte(cli[k], 112, yc, { largeur: D - 116 }) + 0.8; }
            if (devis.chantier) { texte('Adresse du chantier :', 112, yc + 1, { gras: true, taille: 8 }); texte(devis.chantier, 112, yc + 5, { taille: 8, largeur: D - 116 }); }
            y += hCli + 7;

            if (devis.objet) { y += texte('Objet : ' + devis.objet, G, y, { largeur: L }) + 3; }

            // Tableau
            var cols = [{ t: 'Désignation', x: G + 2, w: 82 }, { t: 'Qté', x: 112, d: true }, { t: 'Unité', x: 116 },
                        { t: 'Prix unit. HT', x: 152, d: true }, { t: 'TVA', x: 167, d: true }, { t: 'Total HT', x: D - 2, d: true }];
            place(14);
            doc.setFillColor(MARINE[0], MARINE[1], MARINE[2]); doc.rect(G, y, L, 8, 'F');
            for (var h = 0; h < cols.length; h++) texte(cols[h].t, cols[h].x, y + 5.3, { gras: true, couleur: [255, 255, 255], droite: cols[h].d });
            y += 8;
            for (var r = 0; r < c.lignes.length; r++) {
                var li = c.lignes[r];
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
                var des = doc.splitTextToSize(li.designation, 80);
                var hl = Math.max(7, des.length * 3.8 + 3.2);
                place(hl);
                var yt = y + 4.8;
                texte(des, G + 2, yt);
                texte(String(li.qte).replace('.', ','), 112, yt, { droite: true });
                texte(li.unite, 116, yt);
                texte(euros(li.pu), 152, yt, { droite: true });
                texte(c.franchise ? '—' : String(c.taux).replace('.', ',') + ' %', 167, yt, { droite: true });
                texte(euros(li.total), D - 2, yt, { droite: true });
                y += hl;
                doc.setDrawColor(CLAIR[0], CLAIR[1], CLAIR[2]); doc.setLineWidth(0.2); doc.line(G, y, D, y);
            }

            // Totaux
            y += 5; place(26);
            var xl = 168, xr = D - 2;
            texte('Total HT', xl, y, { droite: true }); texte(euros(c.ht), xr, y, { droite: true }); y += 5;
            if (c.franchise) { texte('TVA non applicable, art. 293 B du CGI', xr, y, { droite: true, taille: 8, couleur: GRIS }); }
            else { texte('TVA ' + String(c.taux).replace('.', ',') + ' %', xl, y, { droite: true }); texte(euros(c.tva), xr, y, { droite: true }); }
            y += 2.5;
            doc.setDrawColor(MARINE[0], MARINE[1], MARINE[2]); doc.setLineWidth(0.4); doc.line(120, y, D, y); y += 4.5;
            texte('Total TTC', xl, y, { droite: true, gras: true }); texte(euros(c.ttc), xr, y, { droite: true, gras: true }); y += 2.5;
            doc.line(120, y, D, y); y += 4.5;
            if (nombre(fiche.acompte) > 0) { texte('Acompte à la signature (' + nombre(fiche.acompte) + ' %)', xl, y, { droite: true }); texte(euros(c.acompte), xr, y, { droite: true }); y += 5; }

            // Conditions et mentions
            y += 3;
            var dechetsLigne = 0;
            for (var dl = 0; dl < c.lignes.length; dl++) if (/d[ée]chet/i.test(c.lignes[dl].designation)) dechetsLigne += c.lignes[dl].total;
            var mentions = [
                'Conditions : devis gratuit, valable ' + (Math.round(nombre(fiche.validite)) || 30) + ' jours. Paiement par ' + fiche.paiement + '.' +
                    (nombre(fiche.acompte) > 0 ? ' Acompte de ' + nombre(fiche.acompte) + ' % à la signature, solde à la fin des travaux.' : '') +
                    (devis.duree ? ' Durée estimée des travaux : ' + devis.duree + '.' : ''),
                'Déchets : les déchets du chantier sont triés puis déposés par nos soins à : ' + fiche.dechetterie + '. Coût estimé : ' + (dechetsLigne > 0 ? euros(dechetsLigne) + ' HT.' : 'inclus.'),
                'Assurance décennale : ' + fiche.decennale + '.' + (fiche.rcpro ? ' RC professionnelle : ' + fiche.rcpro + '.' : ''),
            ];
            if (fiche.mediateur) mentions.push('Médiateur de la consommation : ' + fiche.mediateur + '.');
            if (!c.franchise && c.taux > 0 && c.taux < 20) mentions.push("TVA à taux réduit : le client certifie que les travaux portent sur des locaux à usage d'habitation achevés depuis plus de deux ans, et qu'ils n'ont pas pour effet de rendre l'immeuble neuf ni d'augmenter sa surface de plancher de plus de 10 %.");
            for (var m = 0; m < mentions.length; m++) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
                var hm = doc.splitTextToSize(mentions[m], L).length * 3.4;
                place(hm + 2);
                y += texte(mentions[m], G, y, { taille: 8, couleur: GRIS, largeur: L }) + 1.6;
            }
            place(8);
            texte('Souhaitez-vous conserver les pièces remplacées ?', G, y + 1, { taille: 8, couleur: GRIS });
            doc.setDrawColor(GRIS[0], GRIS[1], GRIS[2]); doc.setLineWidth(0.25);
            doc.rect(G + 72, y - 1.8, 3, 3); texte('Oui', G + 77, y + 1, { taille: 8, couleur: GRIS });
            doc.rect(G + 88, y - 1.8, 3, 3); texte('Non', G + 93, y + 1, { taille: 8, couleur: GRIS });
            y += 7;

            // Signature
            place(36);
            doc.setDrawColor(MARINE[0], MARINE[1], MARINE[2]); doc.setLineWidth(0.3);
            doc.rect(98, y, D - 98, 34);
            texte('Bon pour accord du client', 102, y + 5.5, { gras: true });
            texte("« Devis reçu avant l'exécution des travaux. Bon pour accord. »", 102, y + 10.5, { taille: 8, largeur: D - 106 });
            texte('Date :', 102, y + 19); texte('Signature :', 102, y + 26);

            var nb = doc.getNumberOfPages();
            if (nb > 1) for (var pg = 1; pg <= nb; pg++) { doc.setPage(pg); texte(numero + ' – page ' + pg + '/' + nb, D, 291, { taille: 7, couleur: GRIS, droite: true }); }
            return { doc: doc, numero: numero, calcul: c };
        }
        /* ===================== COMPRENDRE CE QUI EST DIT ===================== */
        var MOTS_NOMBRES = {
            'zero': 0, 'zéro': 0, 'un': 1, 'une': 1, 'deux': 2, 'trois': 3, 'quatre': 4, 'cinq': 5, 'six': 6, 'sept': 7, 'huit': 8, 'neuf': 9,
            'dix': 10, 'onze': 11, 'douze': 12, 'treize': 13, 'quatorze': 14, 'quinze': 15, 'seize': 16,
            'vingt': 20, 'vingts': 20, 'trente': 30, 'quarante': 40, 'cinquante': 50, 'soixante': 60
        };

        function propre(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
        function majuscule(t) { t = propre(t); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
        /* sans accents ni ligatures, pour comparer */
        function plat(t) { return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/œ/g, 'oe').replace(/æ/g, 'ae'); }
        function bas(t) { return plat(t).toLowerCase(); }
        function sansPonct(m) { return String(m).replace(/[.,;:!?]+$/, ''); }

        function estPasser(t) {
            var s = propre(t);
            return /^non[.!]?$/i.test(s) ||
                   /^(passer|passe|on passe|suivant|suivante|aucun|aucune|rien|non merci|pas besoin|je n'en ai pas|j'en ai pas|je l'ai pas|je ne l'ai pas|pas de|je ne sais pas|je sais pas|aucune idée|même adresse|la même|pareil|idem)\b/i.test(s);
        }

        function estMotNombre(m) {
            var s = bas(sansPonct(m));
            if (!s) return false;
            if (/^\d+([.,]\d+)?$/.test(s)) return true;
            return s.split('-').every(function (p) { return p in MOTS_NOMBRES || p === 'cent' || p === 'cents' || p === 'mille' || p === 'et'; }) && s !== 'et';
        }
        function estMotNombreLettres(m) { return estMotNombre(m) && !/\d/.test(m); }

        function motsVersNombre(t) {
            var mots = bas(t).replace(/-/g, ' ').split(/\s+/).filter(function (m) { return m && m !== 'et'; });
            var total = 0, courant = 0, trouve = false;
            for (var i = 0; i < mots.length; i++) {
                var m = mots[i];
                if (m === 'cent' || m === 'cents') { courant = (courant || 1) * 100; trouve = true; }
                else if (m === 'mille') { total += (courant || 1) * 1000; courant = 0; trouve = true; }
                else if ((m === 'vingt' || m === 'vingts') && courant % 100 === 4) { courant = courant - 4 + 80; trouve = true; }
                else if (m in MOTS_NOMBRES) { courant += MOTS_NOMBRES[m]; trouve = true; }
                else if (/^\d+$/.test(m)) { courant += parseInt(m, 10); trouve = true; }
            }
            return trouve ? total + courant : null;
        }

        /* Mots que le micro entend à la place d'un nombre (« cette » pour sept, « sans » pour cent…) */
        var HOMOPHONES_NOMBRES = {
            'sans': 'cent', 'sang': 'cent', "s'en": 'cent', 'sent': 'cent', 'san': 'cent',
            'vin': 'vingt', 'vins': 'vingt', 'vain': 'vingt', 'vint': 'vingt',
            'cette': 'sept', 'set': 'sept', 'sets': 'sept', 'cet': 'sept', 'sete': 'sept',
            'dis': 'dix', 'dit': 'dix', 'dits': 'dix',
            'saint': 'cinq', 'sein': 'cinq', 'seins': 'cinq', 'cinque': 'cinq',
            'scie': 'six', 'cis': 'six',
            'cat': 'quatre', 'catre': 'quatre', 'quatres': 'quatre', 'katre': 'quatre',
            'mil': 'mille', 'mile': 'mille', 'milles': 'mille', 'miles': 'mille',
            'trante': 'trente', 'carante': 'quarante', 'soissante': 'soixante',
            'neufs': 'neuf', 'huits': 'huit', "d'eux": 'deux', 'deu': 'deux', 'troie': 'trois', 'troi': 'trois', 'hein': 'un', 'zeros': 'zero'
        };
        var LIANTS_NOMBRES = { 'et': 1, 'virgule': 1, 'zero': 1 };

        function homophonesNombres(s) {
            var mots = s.split(' ').filter(Boolean), conv = [], autres = 0, nb = 0;
            for (var i = 0; i < mots.length; i++) {
                var m = bas(mots[i]), h = HOMOPHONES_NOMBRES[m];
                if (estMotNombreLettres(m) || LIANTS_NOMBRES[m]) { conv.push(m); if (!LIANTS_NOMBRES[m]) nb++; }
                else if (h) { conv.push(h); if (h !== 'cent') nb++; else conv[conv.length - 1] = '#cent'; }
                else autres++;
            }
            if (autres) return s;
            /* « sans » ne vaut cent que s'il est collé à un autre nombre */
            for (var k = 0; k < conv.length; k++) if (conv[k] === '#cent') conv[k] = nb ? 'cent' : 'sans';
            return conv.join(' ');
        }

        /* « 450 euros », « 55,50 », « quatre cent cinquante », « 2h30 », « douze euros cinquante » -> nombre (ou null) */
        function nombreFr(t) {
            var s = ' ' + bas(propre(t).replace(/[’‘]/g, "'")) + ' ';
            s = s.replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2').replace(/(\d)\s*virgule\s*(\d)/g, '$1,$2');
            var m = s.match(/(\d+)\s*(?:h|heures?)\s*(\d{1,2})(?!\d)/);
            if (m) return Math.round((parseInt(m[1], 10) + parseInt(m[2], 10) / 60) * 100) / 100;
            m = s.match(/(\d+)\s*(?:€|euros?)\s*(\d{1,2})(?!\d)/);
            if (m) return parseInt(m[1], 10) + parseInt(m[2], 10) / 100;
            var frac = 0;
            if (/\bet quart\b/.test(s)) { frac += 0.25; s = s.replace(/\bet quart\b/g, ' '); }
            if (/\bet demie?\b/.test(s)) { frac += 0.5; s = s.replace(/\bet demie?\b/g, ' '); }
            if (/\btrois quarts?\b/.test(s)) { frac += 0.75; s = s.replace(/\btrois quarts?\b/g, ' '); }
            if (/\b(une )?demi[- ]?heure\b/.test(s)) { frac += 0.5; s = s.replace(/\b(une )?demi[- ]?heure\b/g, ' '); }
            if (/\b(un )?quart d'heure\b/.test(s)) { frac += 0.25; s = s.replace(/\b(un )?quart d'heure\b/g, ' '); }
            s = s.replace(/€|euros?|balles|heures?|\bh\b|jours?|pour ?cent|%|\bht\b|\bttc\b|d'heure/g, ' ');
            var chiffres = s.replace(/(\d)\s+(?=\d{3}\b)/g, '$1').match(/\d+(?:[.,]\d+)?/);
            if (chiffres) return parseFloat(chiffres[0].replace(',', '.')) + frac;
            s = homophonesNombres(propre(s));
            var parts = s.split(/\bvirgule\b/);
            var entier = motsVersNombre(parts[0]);
            if (entier === null) return frac ? frac : null;
            var n = entier;
            if (parts[1]) {
                var dec = motsVersNombre(parts[1]);
                if (dec !== null) n = parseFloat(entier + '.' + (dec < 10 && /\bzero\b/.test(parts[1]) ? '0' + dec : String(dec)));
            }
            return n + frac;
        }

        var RE_UNITE = /^(litres?|l|mm|millimetres?|cm|centimetres?|m|metres?|ml|bars?|kw|kilowatts?|kilo|watts?|w|degres?|pouces?|jours?|journees?|heures?|h|semaines?|mois|ans?|annees?|minutes?|min|kg|kilos?)$/;

        /* « deux cents litres » -> « 200 litres », « trois jours » -> « 3 jours » */
        function nombresAvantUnites(t) {
            var mots = t.split(' '), out = [];
            for (var i = 0; i < mots.length; i++) {
                if (estMotNombreLettres(mots[i])) {
                    var j = i;
                    while (j < mots.length && (estMotNombreLettres(mots[j]) || (bas(mots[j]) === 'et' && j + 1 < mots.length && estMotNombreLettres(mots[j + 1])))) j++;
                    if (j < mots.length && RE_UNITE.test(bas(sansPonct(mots[j])))) {
                        var v = motsVersNombre(mots.slice(i, j).join(' '));
                        if (v !== null) { out.push(String(v)); i = j - 1; continue; }
                    }
                }
                out.push(mots[i]);
            }
            return out.join(' ');
        }

        var DIAMETRES = { '8': '13', '10': '14', '12': '17', '15': '21', '20': '27', '26': '34', '33': '42', '40': '49', '50': '60' };
        function mesuresPlomberie(t) {
            t = t.replace(/\bquinze (?:par |sur )?vingt[- ]et[- ]un\b/gi, '15x21').replace(/\bvingt (?:par |sur )?vingt[- ]sept\b/gi, '20x27')
                 .replace(/\bdouze (?:par |sur )?dix[- ]sept\b/gi, '12x17').replace(/\bvingt[- ]six (?:par |sur )?trente[- ]quatre\b/gi, '26x34')
                 .replace(/\btrente[- ]trois (?:par |sur )?quarante[- ]deux\b/gi, '33x42');
            t = t.replace(/\b(\d{1,2})\s*(?:par|sur|x|fois|\/|-)?\s*(\d{2})\b/g, function (x, a, b) { return DIAMETRES[a] === b ? a + 'x' + b : x; });
            t = t.replace(/\btrois[- ]quarts?\b/gi, '3/4').replace(/\b(?:un )?demi[- ]pouces?\b/gi, '1/2"');
            t = t.replace(/(\d)\s*millim[eè]tres?(?=\s|$|[.,;])/gi, '$1 mm').replace(/(\d)\s*centim[eè]tres?(?=\s|$|[.,;])/gi, '$1 cm')
                 .replace(/(\d)\s*(?:kilo ?watts?|kw)(?=\s|$|[.,;])/gi, '$1 kW').replace(/(\d)\s*degr[ée]s?(?=\s|$|[.,;])/gi, '$1 °C');
            return t;
        }

        function corrigerVocab(t, nom) {
            t = propre(t);
            if (nom === 'plomberie' || nom === 'duree') t = nombresAvantUnites(t);
            if (nom === 'plomberie') t = mesuresPlomberie(t);
            if (nom === 'assurance') {
                t = t.replace(/\b(?:w ?w ?w|trois w|3 ?w|double v double v double v)\s*(?:point|\.)\s*/gi, 'www.')
                     .replace(/(\S+)\s+(?:point|\.)\s+(fr|com|org|net|eu|info)\b/gi, function (x, a, b) { return a.toLowerCase() + '.' + b.toLowerCase(); });
            }
            var ix = indexVocab(nom), mots = t ? t.split(' ') : [], out = [], n = 0;
            for (var i = 0; i < mots.length;) {
                var fait = false;
                for (var L = Math.min(ix.max, mots.length - i); L >= 1 && !fait; L--) {
                    var fen = mots.slice(i, i + L), suf = (fen[L - 1].match(/[.,;:!?]+$/) || [''])[0];
                    var brut = fen.join(' '); brut = brut.slice(0, brut.length - suf.length);
                    var k = formeCle(brut), canon = ix.exact[k], pluriel = false;
                    if (!canon && /s$/.test(k) && ix.exact[k.slice(0, -1)]) { canon = ix.exact[k.slice(0, -1)]; pluriel = true; }
                    if (!canon && L <= 2 && !/\d/.test(brut) && !PROTEGES[k]) {
                        var p = clePhon(brut);
                        /* à deux mots, chaque mot doit compter (sinon « alliance et » avalerait « et ») */
                        if (L === 2 && (clePhon(fen[0]) === p || clePhon(sansPonct(fen[1])) === p || ix.exact[formeCle(fen[0])] || PETITS_LIENS[bas(fen[0])] || PETITS_LIENS[bas(sansPonct(fen[1]))])) p = '';
                        if (p.length >= 5 && ix.phon[p]) { canon = ix.phon[p]; pluriel = /[sx]$/.test(k); }
                    }
                    if (canon) { out.push(accorder(canon, pluriel) + suf); i += L; n++; fait = true; }
                }
                if (!fait) { out.push(mots[i]); i++; }
            }
            t = out.join(' ');
            if (nom === 'plomberie') t = t.replace(/^(?:(?:un|une|des|le|la|les|du|de la)\s+|l')(?=\S)/i, '');
            return { texte: t, n: n };
        }

        /* 4) Les adresses : « 12 rue des lilas 69003 lyon » -> « 12 rue des Lilas, 69003 Lyon » */
        var RE_VOIE = /^(rue|ruelle|avenue|av|boulevard|bd|impasse|allee|chemin|place|route|quai|cours|square|passage|voie|sentier|lotissement|residence|hameau|lieu-dit|lieudit|chaussee|esplanade|parvis|promenade|rond-point|faubourg|montee|cite|villa|domaine|zone|parc|carrefour|traverse|venelle|clos|batiment|bat|appartement|appt|apt|etage|escalier|esc|porte|bis|ter|quater)$/;
        var SIGLES_ADRESSE = { cedex: 'CEDEX', bp: 'BP', cs: 'CS', za: 'ZA', zi: 'ZI', zac: 'ZAC', zae: 'ZAE' };
        var PETITS_ADRESSE = { de: 1, du: 1, des: 1, la: 1, le: 1, les: 1, et: 1, au: 1, aux: 1, en: 1, sur: 1, sous: 1, 'lès': 1, lez: 1, 'à': 1 };
        var PETITS_MOTS = { de: 1, du: 1, des: 1, la: 1, le: 1, les: 1, et: 1, 'd\'': 1, 'l\'': 1 };

        /* Met une majuscule où il faut, y compris « Jean-Pierre », « d'Arsonval », « Saint-Médard-en-Jalles » */
        function capitaliser(m, petits, forcer) {
            if (!m || /^\d/.test(m)) return m;
            if (/^[A-Z0-9&]{2,}$/.test(m)) return m;
            if (/[a-zà-ÿ][A-ZÀ-Þ]/.test(m)) return m;
            return m.split('-').map(function (p, i) {
                var a = /^([dl])['’](.+)$/i.exec(p);
                if (a) return ((forcer && i === 0) ? a[1].toUpperCase() : a[1].toLowerCase()) + "'" + capitaliser(a[2], petits, true);
                if (!(forcer && i === 0) && petits[p.toLowerCase()]) return p.toLowerCase();
                return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
            }).join('-');
        }

        function formaterAdresse(t) {
            var s = ' ' + propre(t) + ' ';
            s = s.replace(/\s+virgule\s+/gi, ', ').replace(/^\s*(au|num[ée]ro|n°)\s+(?=\d)/i, ' ');
            var mots = propre(s).split(' ');
            /* numéro dit en lettres : « douze rue… » -> « 12 rue… » */
            var j = 0; while (j < mots.length && estMotNombreLettres(mots[j])) j++;
            if (j > 0 && j < mots.length && RE_VOIE.test(bas(sansPonct(mots[j])))) { var v = motsVersNombre(mots.slice(0, j).join(' ')); if (v !== null) mots = [String(v)].concat(mots.slice(j)); }
            var apresCP = false, prec = '';
            mots = mots.map(function (m, i) {
                var nu = sansPonct(m), suf = m.slice(nu.length), low = bas(nu), r;
                if (/^\d{5}$/.test(nu)) { apresCP = true; prec = low; return m; }
                if (SIGLES_ADRESSE[low]) r = SIGLES_ADRESSE[low];
                else if (nu.length === 1 && /^(batiment|bat|escalier|esc|porte)$/.test(prec)) r = nu.toUpperCase();
                else if (!apresCP && RE_VOIE.test(low)) r = nu.toLowerCase();
                else r = capitaliser(nu, PETITS_ADRESSE, i === 0 || /^\d{5}$/.test(prec));
                prec = low;
                return r + suf;
            });
            return mots.join(' ').replace(/([^,\s])\s+(\d{5})(?=\s|$)/, '$1, $2');
        }

        var SIGLES_NOMS = { sarl: 'SARL', sas: 'SAS', sasu: 'SASU', eurl: 'EURL', ei: 'EI', eirl: 'EIRL', sci: 'SCI', snc: 'SNC', sa: 'SA', btp: 'BTP', rge: 'RGE', cvc: 'CVC', mme: 'Mme', mlle: 'Mlle', mr: 'M.' };
        function enTitre(t) {
            return propre(t).split(' ').map(function (m, i) {
                var nu = sansPonct(m), suf = m.slice(nu.length);
                var low = nu.toLowerCase();
                if (SIGLES_NOMS[low] && !(i === 0 && (low === 'sa' || low === 'ei'))) return SIGLES_NOMS[low] + (low === 'mr' ? '' : suf);
                if (i > 0 && PETITS_MOTS[nu.toLowerCase()]) return nu.toLowerCase() + suf;
                return capitaliser(nu, PETITS_MOTS, i === 0) + suf;
            }).join(' ');
        }

        /* Quantité dite avec la fourniture : « 2 robinets » -> quantité 2, « Robinets » */
        function extraireQuantite(des) {
            var m = /^(\d{1,3}|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|onze|douze|quinze|vingt)\s+(\S.*)$/i.exec(propre(des));
            if (!m) return null;
            var premier = bas(sansPonct(m[2].split(' ')[0]));
            if (RE_UNITE.test(premier) || /^(x|par|fois|sur|a|%|°c?|euros?|€|pour|et|ou|de|virgule)$/.test(premier) || /^\d/.test(premier)) return null;
            var q = /^\d+$/.test(m[1]) ? parseInt(m[1], 10) : motsVersNombre(m[1]);
            if (!q || q < 1 || q > 500) return null;
            return { qte: String(q), des: majuscule(m[2]) };
        }

        /* Enlève les hésitations, les reprises, les phrases d'introduction et les mots répétés, puis corrige */
        function nettoyer(brut, q) {
            q = q || {};
            var t = ' ' + propre(String(brut == null ? '' : brut).replace(/[’‘]/g, "'")) + ' ', avant;
            do { avant = t; t = t.replace(/\s(euh+|heu+|hum+|hm+|mmh+|bah|ben|beh|bref|en fait|du coup|tu vois|vous voyez)[,.]?\s/gi, ' '); } while (t !== avant);
            t = propre(t);
            if (q.type !== 'ouinon') t = autocorriger(t);
            for (var k = 0; k < 3; k++) {
                t = t.replace(/^(alors|donc|ok|okay|oui alors|bon alors|ouais alors|bon)[,]?\s+/i, '');
                t = t.replace(/^(c'est|c'était|ce sera|ce serait|ça sera|ça serait|ça s'appelle|il s'appelle|elle s'appelle|on s'appelle|je m'appelle|mon nom c'est|mon nom est|le nom c'est|le nom est|le nom de (mon|l'|la) ?entreprise (c'est|est)|mon entreprise (s'appelle|c'est)|l'entreprise (s'appelle|c'est)|la société (s'appelle|c'est)|le client (c'est|s'appelle)|la cliente (c'est|s'appelle)|son nom c'est|son nom est|l'adresse (c'est|est)|son adresse (c'est|est)|mon adresse (c'est|est)|(il|elle) habite( au| à)?|j'habite( au| à)?|mon (adresse )?(e-?mail|mail|courriel) (c'est|est)|l'e-?mail (c'est|est)|son (adresse )?(e-?mail|mail) (c'est|est)|(mon|son|le) (numéro|téléphone|portable|tel|tél)( de téléphone)? (c'est|est)|(mon|le) siret (c'est|est)|le prix (c'est|est)|ça coûte|ça fait|ça fera|on va dire|je pense|il faut|il me faut|il faudrait|il faudra|on met|on va mettre|je vais mettre|il y a|on a|j'ai mis|je mets|je dirais|disons|en gros)[,]?\s+/i, '');
                t = t.replace(/^j'ai besoin d(e\s+|')/i, '');
            }
            t = t.replace(/[\s,]+(voilà|voila|c'est tout|c'est bon|merci|hein|quoi)[.!]?$/i, '');
            if (!q.type) {
                t = sansRepetitions(t, q.titre);
                t = t.replace(/\b(\d{2}) (\d{3})\b/g, function (x, a, b) { return /^(0[1-9]|[1-8]\d|9[0-8])$/.test(a) ? a + b : x; });
            }
            t = propre(t.replace(/^[,.;:\s]+|[,;:.!?\s]+$/g, ''));
            if (q.vocab) t = corrigerVocab(t, q.vocab).texte;
            if (q.adresse) t = formaterAdresse(t);
            if (q.titre) t = enTitre(t);

        /* Interprète une réponse selon le type de question. Renvoie { ok, valeur, erreur } */
        function interpreter(q, brut) {
            var t = nettoyer(brut, q);
            var v = null;
            if (q.type === 'ouinon') { v = ouiNon(t) || ouiNon(brut); if (v) return { ok: true, valeur: v }; }
            if (q.type === 'nombre' && q.defaut == null && t && nombreFr(t) === null && estZero(t)) return { ok: true, valeur: '0' };
            if (!t || estPasser(t)) {
                if (q.requis) return { ok: false, erreur: 'Cette information est obligatoire.' };
                return { ok: true, valeur: q.defaut != null ? q.defaut : '', passe: true };
            }
            switch (q.type) {
                case 'nombre': v = nombreFr(t); if (v === null) return { ok: false, erreur: "Je n'ai pas compris le nombre. Dites par exemple « 55 »." }; return { ok: true, valeur: String(Math.round(v * 100) / 100) };
                case 'ouinon': return { ok: false, erreur: 'Répondez par oui ou par non.' };
                case 'forme': v = formeJuridique(t); if (!v) return { ok: false, erreur: 'Dites : micro-entreprise, EI, EURL, SARL, SASU ou SAS.' }; return { ok: true, valeur: v };
                case 'taux': v = tauxTva(t); if (!v) return { ok: false, erreur: 'Dites : 10, 20 ou 5,5.' }; return { ok: true, valeur: v };
                case 'siret': v = siret(t); if (!v) return { ok: false, erreur: 'Le SIRET doit faire 14 chiffres. Redites-le lentement.' }; return { ok: true, valeur: v };
                case 'tel': v = telephone(t); if (!v) return { ok: false, erreur: "Je n'ai pas compris le numéro. Redites-le." }; return { ok: true, valeur: v };
                case 'email': v = email(t); if (!v) return { ok: false, erreur: 'E-mail incompris. Dites par exemple « contact arobase plomberie martin point fr ».' }; return { ok: true, valeur: v };
                default: return { ok: true, valeur: q.casse ? t : majuscule(t) };

        }

        /* Parmi ce que le micro a cru entendre, garde la version la plus plausible */
        function scoreProposition(q, brut) {
            var res = interpreter(q, brut);
            if (!res.ok) return -1;
            if (res.passe) return 0;

            if (q.vocab) sc += 2 * corrigerVocab(nettoyer(brut, { type: q.type }), q.vocab).n;
            if (q.adresse) { if (/\b\d{5}\b/.test(res.valeur)) sc += 2; if (res.valeur.split(' ').some(function (m) { return RE_VOIE.test(bas(sansPonct(m))); })) sc += 1; }
            return sc;
        }

        /* ===================== LES QUESTIONS ===================== */
        var QUESTIONS_FICHE = [
            { cle: 'nom', texte: 'Quel est le nom de votre entreprise ?', aide: 'Ex. : Plomberie Martin', requis: true, titre: true },
            { cle: 'forme', texte: 'Quelle est sa forme juridique ?', aide: 'Micro-entreprise, EI, EURL, SARL, SASU ou SAS', type: 'forme', requis: true },
            { cle: 'dirigeant', texte: 'Quel est votre nom ?', aide: 'Ex. : Jean Martin', titre: true },
            { cle: 'adresse', texte: "Quelle est l'adresse de votre entreprise ?", aide: 'Ex. : 12 rue des Lilas, 69003 Lyon', requis: true, adresse: true },
            { cle: 'tel', texte: 'Votre numéro de téléphone ?', aide: 'Ex. : 06 12 34 56 78', type: 'tel', requis: true },
            { cle: 'email', texte: 'Votre adresse e-mail ?', aide: 'Dites « arobase » pour @ et « point » pour le point', type: 'email' },

        var QUESTIONS_CLIENT = [

        /* Devis : client, puis une boucle de fournitures, puis main-d'œuvre, TVA, durée */
        function questionDevis(r, f) {
            for (var i = 0; i < QUESTIONS_CLIENT.length; i++) if (!(QUESTIONS_CLIENT[i].cle in r)) return QUESTIONS_CLIENT[i];

        function questionFiche(r) {

        function trouverQuestion(cle) {

        /* ===================== ÉTAT ===================== */
        var APP = { mode: 'fiche', fiche: null, rep: {}, ordre: [], courante: null, erreur: '', lignes: null, pdf: null };

        function stock(cle, v) {
            try {
                if (v === undefined) { var s = window.localStorage.getItem(cle); return s ? JSON.parse(s) : null; }
                if (v === null) window.localStorage.removeItem(cle); else window.localStorage.setItem(cle, JSON.stringify(v));
                return true;
            } catch (e) { return v === undefined ? null : false; }
        }

        function ficheDepuisReponses(r) {
            return {
                nom: r.nom || '', forme: r.forme || '', dirigeant: r.dirigeant || '', adresse: r.adresse || '', tel: r.tel || '', email: r.email || '',
                siret: r.siret || '', rm: r.rm || '', regime: r.regime === 'non' ? 'franchise' : 'assujetti', tvaNum: r.tvaNum || '', tauxDefaut: r.tauxDefaut || '10',
                decennale: r.decennale || '', rcpro: r.rcpro || '', mediateur: r.mediateur || '', tauxHoraire: r.tauxHoraire || '0', deplacement: r.deplacement || '0',
                dechetsPrix: r.dechetsPrix || '0', dechetterie: r.dechetterie || '', acompte: r.acompte || '0', validite: r.validite || '30', paiement: r.paiement || ''
            };
        }

        function reponsesDepuisFiche(f) {
            var r = {};
            for (var k in f) r[k] = f[k];
            r.regime = f.regime === 'franchise' ? 'non' : 'oui';
            return r;
        }

        function ficheValide(f) {
            return !!(f && f.nom && f.forme && f.adresse && f.tel && f.siret && f.decennale && f.dechetterie && f.paiement);
        }

        /* Lien personnel : la fiche voyage dans l'adresse, rien à refaire si le téléphone oublie */
        function encoderFiche(f) {
            var b = btoa(unescape(encodeURIComponent(JSON.stringify(f))));
            return b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function decoderFiche(code) {
            try {
                var b = String(code).replace(/-/g, '+').replace(/_/g, '/');
                while (b.length % 4) b += '=';
                var f = JSON.parse(decodeURIComponent(escape(atob(b))));
                return ficheValide(f) ? f : null;
            } catch (e) { return null; }
        }
        function config(nom) {
            var el = document.getElementById('cfg');
            var v = el ? el.getAttribute('data-' + nom) || '' : '';
            return v.indexOf('<' + '?') === 0 ? '' : v;
        }
        function lienPersonnel(f) {
            var base = config('url') || (location.href.split('#')[0].split('?')[0]);
            return base + '?f=' + encoderFiche(f);
        }

        /* ===================== DÉMARRAGE ===================== */
        function demarrer() {
            var deLien = decoderFiche(config('fiche') || (new URLSearchParams(location.search)).get('f') || '');
            APP.fiche = deLien || stock('va_fiche');
            if (deLien) stock('va_fiche', deLien);
            if (ficheValide(APP.fiche)) {
                var b = stock('va_devis');
                if (b && b.rep) { APP.mode = b.mode || 'devis'; APP.rep = b.rep; APP.ordre = b.ordre || []; APP.lignes = b.lignes || null; APP.autoQte = b.autoQte || {}; }
                else nouveauDevis(true);
            } else {
                APP.mode = 'fiche'; APP.rep = {}; APP.ordre = [];
            }
            avancer(false);
            afficherAideNavigateur();
        }

        function sauverBrouillon() {
            if (APP.mode === 'fiche') return;
            stock('va_devis', { mode: APP.mode, rep: APP.rep, ordre: APP.ordre, lignes: APP.lignes, autoQte: APP.autoQte || {} });
        }

        function nouveauDevis(silencieux) {
            APP.mode = 'devis'; APP.rep = {}; APP.ordre = []; APP.lignes = null; APP.pdf = null; APP.erreur = ''; APP.autoQte = {};
            stock('va_devis', null);
            if (!silencieux) { avancer(true); }
        }

        function modifierFiche() {
            arreterEcoute();
            APP.mode = 'fiche-edition';
            APP.rep = reponsesDepuisFiche(APP.fiche);
            APP.ordre = [];
            for (var i = 0; i < QUESTIONS_FICHE.length; i++) { var q = QUESTIONS_FICHE[i]; if (!q.si || q.si(APP.rep)) APP.ordre.push(q.cle); }
            APP.courante = null;
            dessiner();
            window.scrollTo(0, 0);
        }

        /* Passe à la question suivante (ou à la fin) */
        function avancer(defiler) {
            APP.erreur = '';
            if (APP.mode === 'fiche') {
                APP.courante = questionFiche(APP.rep);
                if (!APP.courante) {
                    APP.fiche = ficheDepuisReponses(APP.rep);
                    stock('va_fiche', APP.fiche);
                    APP.mode = 'fiche-ok';
                }
            } else if (APP.mode === 'devis') {
                APP.courante = questionDevis(APP.rep, APP.fiche);
                if (!APP.courante) { APP.mode = 'recap'; APP.lignes = APP.lignes || construireLignes(); arreterEcoute(); APP.creerAuto = true; }
            } else {
                APP.courante = null;
            }
            if (!APP.courante) arreterEcoute();
            dessiner();
            if (APP.creerAuto) { APP.creerAuto = false; if (!manques().length) creerPdf(); }
            sauverBrouillon();
            if (defiler) defilerVersCourante();
            if (APP.courante && ECOUTE.session) setTimeout(function () { ecouter(true); }, 350);
        }

        function repondre(brut) {
            var q = APP.courante;
            if (!q) return;
            if (estRetour(brut)) { allerPrecedente(); return; }
            var res = interpreter(q, brut);
            if (!res.ok) {
                APP.erreur = res.erreur;
                dessiner();
                defilerVersCourante();
                if (ECOUTE.session) setTimeout(function () { ecouter(true); }, 900);
                return;
            }
            var valeur = res.valeur, qteDite = null;
            if (q.fourniture && APP.reinserer == null && valeur) { var xq = extraireQuantite(valeur); if (xq) { valeur = xq.des; qteDite = xq.qte; } }
            APP.rep[q.cle] = valeur;
            if (APP.reinserer != null) { APP.ordre.splice(APP.reinserer, 0, q.cle); APP.reinserer = null; }
            else APP.ordre.push(q.cle);
            if (qteDite) { var kq = q.cle.replace(/des$/, 'qte'); APP.rep[kq] = qteDite; APP.ordre.push(kq); APP.autoQte = APP.autoQte || {}; APP.autoQte[kq] = true; }
            avancer(true);
        }

        function allerPrecedente() {
            if (APP.mode === 'recap') APP.mode = 'devis';
            if (APP.mode === 'fiche-ok') APP.mode = 'fiche';
            if (!APP.ordre.length) {
                APP.erreur = "C'est déjà la première question.";
                dessiner(); defilerVersCourante();
                if (ECOUTE.session) setTimeout(function () { ecouter(true); }, 900);
                return;
            }
            var cle = APP.ordre.pop();
            delete APP.rep[cle];
            /* quantité comprise avec la fourniture : on revient directement à la fourniture */
            if (APP.autoQte && APP.autoQte[cle] && APP.ordre.length) { delete APP.autoQte[cle]; var des = APP.ordre.pop(); delete APP.rep[des]; }
            if (/^f\d+_|^heures$/.test(cle)) APP.lignes = null;
            APP.pdf = null;
            avancer(true);
            etat('Retour à la question précédente.');
        }

        function corriger(cle, brut) {
            var q = trouverQuestion(cle);
            var res = interpreter(q, brut);
            var el = document.getElementById('rep-' + cle);
            if (!res.ok) { if (el) el.style.borderColor = '#f87171'; return; }
            if (el) el.style.borderColor = '';
            APP.rep[cle] = res.valeur;
            APP.pdf = null;
            sauverBrouillon();
            if (APP.mode === 'recap') { dessinerRecap(); majBarrePdf(); }
        }

        function enregistrerFicheModifiee() {
            for (var i = 0; i < APP.ordre.length; i++) {
                var el = document.getElementById('rep-' + APP.ordre[i]);
                if (el) corriger(APP.ordre[i], el.value);
            }
            var f = ficheDepuisReponses(APP.rep);
            if (!ficheValide(f)) { APP.erreur = 'Il manque une information obligatoire (en rouge).'; dessiner(); return; }
            APP.fiche = f; stock('va_fiche', f);
            APP.mode = 'fiche-ok'; APP.erreur = '';
            dessiner(); window.scrollTo(0, 0);
        }

        function refaireQuestion(cle) {
            var i = APP.ordre.indexOf(cle);
            if (i < 0) return;
            delete APP.rep[cle];
            if (APP.autoQte) delete APP.autoQte[cle];
            APP.ordre.splice(i, 1);
            APP.reinserer = i;
            if (APP.mode === 'recap') APP.mode = 'devis';
            if (APP.mode === 'fiche-ok') APP.mode = 'fiche';
            avancer(true);
        }

        function construireLignes() {
            var r = APP.rep, f = APP.fiche, l = [];
            for (var n = 0; ('f' + n + '_des') in r; n++) {
                var p = 'f' + n + '_';
                if (!r[p + 'des']) break;
                l.push({ designation: r[p + 'des'], qte: r[p + 'qte'] || '1', unite: 'u', pu: r[p + 'pu'] || '' });
                if (r[p + 'autre'] !== 'oui') break;
            }
            if (nombre(r.heures) > 0) l.push({ designation: "Main-d'œuvre", qte: r.heures, unite: 'h', pu: f.tauxHoraire });
            if (nombre(f.deplacement) > 0) l.push({ designation: 'Déplacement', qte: '1', unite: 'forfait', pu: f.deplacement });
            l.push({ designation: 'Gestion et évacuation des déchets', qte: '1', unite: 'forfait', pu: f.dechetsPrix || '0' });
            return l;
        }

        function devisPourPdf() {
            var r = APP.rep;
            return { clientNom: r.clientNom || '', clientAdresse: r.clientAdresse || '', clientContact: r.clientContact || '', chantier: r.chantier || '',
                     objet: r.objet || '', duree: r.duree || '', tauxTva: r.tauxTva || APP.fiche.tauxDefaut || '10', lignes: APP.lignes || [] };
        }

        function manques() {
            var d = devisPourPdf(), m = [], ok = 0, sansPrix = 0;
            if (!d.clientNom) m.push('le nom du client');
            if (!d.clientAdresse) m.push("l'adresse du client");
            for (var i = 0; i < d.lignes.length; i++) {
                var l = d.lignes[i];
                if (!propre(l.designation) || nombre(l.qte) <= 0) continue;
                if (propre(l.pu) === '') { sansPrix++; continue; }
                if (nombre(l.pu) > 0) ok++;
            }
            if (sansPrix) m.push(sansPrix + ' ligne(s) sans prix');
            if (!ok) m.push('au moins une ligne avec un prix');
            return m;
        }

        /* ===================== LE MICRO ===================== */
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        var ECOUTE = { session: false, rec: null, essais: 0, resultat: false, aMarche: false };

        function etat(texte, couleur) {
            var e = document.getElementById('etat');
            if (e) { e.textContent = texte; e.className = 'mt-3 text-sm font-semibold ' + (couleur || 'text-gold-400'); }
        }

        function boutonMicroActif(actif) {
            var b = document.getElementById('micro');
            if (!b) return;
            b.classList.toggle('animate-pulse', actif);
            b.style.background = actif ? '#ef4444' : '';
        }

        function toucherMicro() {
            if (ECOUTE.session) { arreterEcoute(); etat('Micro en pause. Touchez-le pour reprendre.'); return; }
            if (!APP.courante) { etat('Il n\'y a plus de question : vérifiez le récapitulatif.'); return; }
            if (!SR) { modeClavier(); return; }
            ECOUTE.session = true;
            ECOUTE.essais = 0;
            if (!stock('va_micro_ok')) etat('Votre téléphone va demander l\'accès au micro : touchez « Autoriser ».');
            ECOUTE.parGeste = true;
            ecouter();
        }

        function ecouter(auto) {
            if (!ECOUTE.session || !APP.courante) return;
            if (auto) ECOUTE.parGeste = false;
            try { if (ECOUTE.rec) ECOUTE.rec.abort(); } catch (e) {}
            var rec = new SR();
            rec.lang = 'fr-FR';
            rec.continuous = false;
            rec.interimResults = true;
            rec.maxAlternatives = 5;
            ECOUTE.rec = rec;
            ECOUTE.resultat = false;
            rec.onstart = function () {
                ECOUTE.aMarche = true;
                stock('va_micro_ok', true);
                boutonMicroActif(true);
                etat('Je vous écoute… Répondez à la question.', 'text-red-300');
            };
            rec.onresult = function (ev) {
                var txt = '', fin = false;
                for (var i = ev.resultIndex || 0; i < ev.results.length; i++) { txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) fin = true; }
                var champ = document.getElementById('saisie');
                if (champ) champ.value = txt;
                if (fin) { ECOUTE.resultat = true; ECOUTE.essais = 0; boutonMicroActif(false); repondre(meilleureProposition(ev, txt)); }
            };
            rec.onerror = function (ev) {
                ECOUTE.dernierCode = ev.error;
                if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed' || ev.error === 'audio-capture') {
                    arreterEcoute();
                    if (ECOUTE.aMarche && !ECOUTE.parGeste) etat('Touchez le micro pour répondre à la question suivante.');
                    else demanderPermissions(ev.error);
                } else if (ev.error === 'no-speech') {
                    etat("Je n'ai rien entendu…", 'text-slate-300');
                } else if (ev.error === 'network') {
                    arreterEcoute(); etat('Pas de connexion internet : le micro a besoin du réseau.', 'text-red-300');
                }
            };
            rec.onend = function () {
                boutonMicroActif(false);
                if (!ECOUTE.session || ECOUTE.resultat || ECOUTE.rec !== rec) return;
                ECOUTE.essais++;
                if (ECOUTE.essais < 3) { setTimeout(function () { ecouter(true); }, 300); }
                else { arreterEcoute(); etat('Touchez le micro quand vous êtes prêt.'); }
            };
            try { rec.start(); }
            catch (e) { arreterEcoute(); etat('Touchez le micro pour continuer.'); }
        }

        /* Pour les gens qui articulent mal : la reconnaissance propose plusieurs phrases, on prend la première qui a du sens */
        function meilleureProposition(ev, defaut) {
            var props = [];
            var n = 0;
            for (var i = 0; i < ev.results.length; i++) n = Math.max(n, ev.results[i].length || 1);
            for (var k = 0; k < n; k++) {
                var s = '';
                for (var j = 0; j < ev.results.length; j++) { var r = ev.results[j]; s += (r[k] || r[0]).transcript; }
                props.push(s);
            }
            if (!props.length) return defaut;
            for (var a = 0; a < props.length; a++) if (estRetour(props[a])) return props[a];
            if (!APP.courante) return props[0];
            var meilleur = props[0], max = -2;
            for (var b = 0; b < props.length; b++) { var sc = scoreProposition(APP.courante, props[b]); if (sc > max) { max = sc; meilleur = props[b]; } }
            return meilleur;
        }

        function arreterEcoute() {
            ECOUTE.session = false;
            try { if (ECOUTE.rec) ECOUTE.rec.abort(); } catch (e) {}
            ECOUTE.rec = null;
            boutonMicroActif(false);
        }

        function modeClavier() {
            var champ = document.getElementById('saisie');
            etat('Touchez la case, puis le micro 🎤 de votre clavier pour parler. Touchez « Valider » quand c\'est bon.', 'text-slate-200');
            if (champ) champ.focus();
        }

        function estIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }

        function afficherAideNavigateur() {
            var z = document.getElementById('aide-navigateur');
            if (!z) return;
            var ua = navigator.userAgent, msg = '';
            if (/FBAN|FBAV|Instagram|WhatsApp|GSA\//.test(ua)) msg = 'Ouvrez cette page dans Safari (iPhone) ou Chrome (Android) pour utiliser le micro : touchez « ⋯ » puis « Ouvrir dans le navigateur ».';
            else if (estIOS() && /CriOS|FxiOS|EdgiOS/.test(ua)) msg = 'Sur iPhone et iPad, le micro du site marche seulement dans Safari. Ouvrez cette page dans Safari, ou utilisez le micro de votre clavier.';
            else if (!SR) msg = 'Ce navigateur ne permet pas le micro du site : utilisez le micro de votre clavier (ou ouvrez la page dans Chrome ou Safari).';
            z.innerHTML = msg ? '<div class="p-3 rounded-xl border border-gold-500/40 bg-gold-500/10 text-gold-400 text-xs">' + msg + '</div>' : '';
        }

        /* Le micro a été refusé : on fait apparaître la demande d'autorisation du téléphone */
        function demanderPermissions(code) {
            ECOUTE.essaisPermission = (ECOUTE.essaisPermission || 0) + 1;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { afficherAideMicro(code); return; }
            etat('Votre téléphone demande l\'accès au micro : touchez « Autoriser ».');
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function (flux) {
                try { flux.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
                if (code === 'service-not-allowed' && ECOUTE.essaisPermission > 1) { afficherAideMicro(code); return; }
                stock('va_micro_ok', true);
                var z = document.getElementById('aide-navigateur'); if (z) z.innerHTML = '';
                etat('Micro autorisé ✓ Touchez le micro pour parler.', 'text-emerald-300');
            }, function () {
                afficherAideMicro(code);
            });
        }

        /* Seulement si le téléphone refuse encore : une ligne courte, l'aide détaillée reste repliée */
        function afficherAideMicro(code) {
            var z = document.getElementById('aide-navigateur');
            var ios = estIOS();
            var aide = code === 'service-not-allowed'
                ? (ios ? 'Activez la dictée : Réglages → Général → Clavier → Activer la dictée. Puis rechargez la page.' : 'La reconnaissance vocale est désactivée sur cet appareil.')
                : (ios ? 'Dans Safari, touchez « aA » à gauche de l\'adresse → Réglages du site web → Microphone → Autoriser. Puis rechargez la page.'
                       : 'Touchez le cadenas à côté de l\'adresse → Autorisations → Micro → Autoriser. Puis rechargez la page.');
            if (z) z.innerHTML = '<details class="text-xs text-slate-400"><summary class="cursor-pointer text-gold-400">Le micro ne démarre pas ? Voir comment l\'autoriser</summary><p class="mt-2">' + esc(aide) + '</p><p class="mt-1 text-slate-600">Code : ' + esc(code || ECOUTE.dernierCode || '?') + '</p></details>';
            etat('Touchez la case de réponse, puis le micro 🎤 du clavier.', 'text-slate-200');
            stock('va_micro_ok', null);
            var champ = document.getElementById('saisie'); if (champ) champ.focus();
        }

        function defilerVersCourante() {
            setTimeout(function () {
                var c = document.getElementById('carte-courante') || document.getElementById('fin');
                if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
        }

        /* ===================== AFFICHAGE ===================== */
        var CHAMP = 'w-full px-3 py-2.5 rounded-lg bg-obsidian/80 border border-white/15 text-slate-100 text-base focus:outline-none focus:border-gold-500/70';

        function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

        function valeurAffichee(cle, v) {
            if (cle === 'regime') return v === 'non' ? 'Non (TVA non applicable)' : 'Oui';
            if (cle === 'tauxDefaut' || cle === 'tauxTva') return String(v).replace('.', ',') + ' %';
            if (v === '') return '';
            return v;
        }

        function dessiner() {
            var titre = document.getElementById('titre-parcours');
            var sous = document.getElementById('sous-titre');
            var barre = document.getElementById('barre-fiche');
            if (APP.mode === 'fiche' || APP.mode === 'fiche-edition') { titre.textContent = 'Ma fiche'; sous.textContent = APP.mode === 'fiche' ? 'Une seule fois : répondez aux questions à voix haute.' : 'Corrigez ce qui a changé, puis enregistrez.'; }
            else if (APP.mode === 'fiche-ok') { titre.textContent = 'Fiche enregistrée'; sous.textContent = ''; }
            else { titre.textContent = 'Nouveau devis'; sous.textContent = 'Touchez le micro et répondez aux questions.'; }
            barre.innerHTML = ficheValide(APP.fiche) && APP.mode !== 'fiche-edition'
                ? '<span class="text-slate-300">Ma fiche : <strong class="text-white">' + esc(APP.fiche.nom) + '</strong></span><button type="button" onclick="modifierFiche()" class="text-gold-400 underline">Modifier</button>'
                : '';
            document.getElementById('zone-micro').style.display = APP.courante ? '' : 'none';
            var q = document.getElementById('question-courante');
            q.textContent = APP.courante ? APP.courante.texte : '';

            var h = '';
            for (var i = 0; i < APP.ordre.length; i++) {
                var cle = APP.ordre[i], qq = trouverQuestion(cle);
                if (APP.mode === 'recap' && /^f\d+_|^heures$/.test(cle)) continue;
                h += '<div class="p-3 rounded-xl bg-obsidian/50 border border-white/10">' +
                        '<div class="flex items-center justify-between gap-2"><p class="text-slate-400 text-xs">' + esc(qq.texte) + '</p>' +
                        (APP.mode === 'fiche-edition' ? '' : '<button type="button" onclick="refaireQuestion(\'' + cle + '\')" class="text-[11px] text-gold-400 underline flex-shrink-0">Redire</button>') + '</div>' +
                        '<input id="rep-' + cle + '" value="' + esc(valeurAffichee(cle, APP.rep[cle])) + '" placeholder="(passé)" onchange="corriger(\'' + cle + '\', this.value)" class="mt-1 w-full bg-transparent text-white text-sm border-b border-transparent focus:border-gold-500/60 focus:outline-none">' +
                     '</div>';
            }
            if (APP.courante) {
                var c = APP.courante;
                h += '<div id="carte-courante" class="p-4 rounded-2xl border-2 border-gold-500/70 bg-gold-500/10 shadow-lg shadow-gold-500/10">' +
                        '<p class="text-gold-400 text-xs font-semibold uppercase tracking-wider">À dire maintenant</p>' +
                        '<p class="text-white text-lg font-semibold mt-1">' + esc(c.texte) + '</p>' +
                        (c.aide ? '<p class="text-slate-400 text-sm mt-1">' + esc(c.aide) + '</p>' : '') +
                        '<textarea id="saisie" rows="2" placeholder="Votre réponse s\'écrit ici…" class="' + CHAMP + ' mt-3"></textarea>' +
                        (APP.erreur ? '<p class="text-red-300 text-sm mt-2">' + esc(APP.erreur) + '</p>' : '') +
                        '<div class="flex gap-2 mt-3">' +
                            (APP.ordre.length ? '<button type="button" onclick="arreterEcoute(); allerPrecedente()" aria-label="Question précédente" class="px-4 py-3 rounded-full text-sm text-slate-200 border border-white/20">←</button>' : '') +
                            '<button type="button" onclick="validerSaisie()" class="flex-1 px-4 py-3 rounded-full text-sm font-bold text-black bg-gradient-to-r from-gold-400 to-gold-600">Valider</button>' +
                            (!c.requis ? '<button type="button" onclick="repondre(\'passer\')" class="px-4 py-3 rounded-full text-sm text-slate-200 border border-white/20">Passer</button>' : '') +
                        '</div>' +
                     '</div>';
            }
            document.getElementById('cartes').innerHTML = h;

            var fin = document.getElementById('fin-zone');
            if (APP.mode === 'fiche-edition') {
                fin.innerHTML = '<div id="fin" class="mt-4">' + (APP.erreur ? '<p class="text-red-300 text-sm mb-2">' + esc(APP.erreur) + '</p>' : '') +
                    '<button type="button" onclick="enregistrerFicheModifiee()" class="w-full px-6 py-4 rounded-full font-bold text-black bg-gradient-to-r from-gold-400 to-gold-600">Enregistrer ma fiche</button></div>';
            } else if (APP.mode === 'fiche-ok') {
                var lien = lienPersonnel(APP.fiche);
                fin.innerHTML = '<div id="fin" class="p-5 rounded-2xl border border-emerald-500/40 bg-emerald-500/10 space-y-3">' +
                    '<p class="text-emerald-300 font-semibold">C\'est enregistré sur ce téléphone.</p>' +
                    '<p class="text-slate-300 text-sm">Gardez aussi votre <strong>lien personnel</strong> : il contient votre fiche. Ouvrez-le puis ajoutez-le à vos favoris, vous n\'aurez jamais à refaire la fiche.</p>' +
                    '<input id="lien-perso" readonly value="' + esc(lien) + '" class="' + CHAMP + ' text-xs">' +
                    '<div class="flex gap-2"><button type="button" onclick="copierLien()" class="flex-1 px-4 py-3 rounded-full text-sm font-semibold text-emerald-200 border border-emerald-400/50">Copier le lien</button>' +
                    '<a href="' + esc(lien) + '" target="_top" class="flex-1 text-center px-4 py-3 rounded-full text-sm font-semibold text-emerald-200 border border-emerald-400/50">Ouvrir le lien</a></div>' +
                    '<p id="lien-msg" class="text-xs text-slate-400"></p>' +
                    '<button type="button" onclick="nouveauDevis()" class="w-full px-6 py-4 rounded-full font-bold text-black bg-gradient-to-r from-gold-400 to-gold-600">Faire mon premier devis</button></div>';
            } else if (APP.mode === 'recap') {
                fin.innerHTML = '<div id="fin"></div>';
                dessinerRecap();
                majBarrePdf();
                return;
            } else fin.innerHTML = '';
            majBarrePdf();
            if (window.lucide) lucide.createIcons();
        }

        function validerSaisie() {
            var c = document.getElementById('saisie');
            arreterEcoute();
            repondre(c ? c.value : '');
        }

        function copierLien() {
            var el = document.getElementById('lien-perso'), msg = document.getElementById('lien-msg'), ok = false;
            el.focus(); el.select();
            try { el.setSelectionRange(0, el.value.length); } catch (e) {}
            try { ok = document.execCommand('copy'); } catch (e) {}
            if (!ok && navigator.clipboard) navigator.clipboard.writeText(el.value).then(function () { msg.textContent = 'Lien copié.'; }, function () {});
            msg.textContent = ok ? 'Lien copié.' : 'Le lien est sélectionné : faites « Copier ».';
        }

        /* Barre « PDF » toujours visible en bas pendant le récapitulatif */
        function majBarrePdf() {
            var barre = document.getElementById('barre-pdf');
            if (!barre) return;
            if (APP.mode !== 'recap') { barre.classList.add('hidden'); return; }
            barre.classList.remove('hidden');
            var m = manques(), b = document.getElementById('barre-pdf-bouton'), info = document.getElementById('barre-pdf-info');
            if (m.length) {
                b.textContent = 'Créer le devis PDF'; b.disabled = true; b.className = b.className.replace(' opacity-40', '') + ' opacity-40';
                info.textContent = 'Il manque : ' + m.join(', ') + '.'; info.className = 'text-xs text-center mb-2 text-red-300';
            } else if (!APP.pdf) {
                b.textContent = 'Créer le devis PDF'; b.disabled = false; b.className = b.className.replace(' opacity-40', '');
                info.textContent = 'Tout est prêt.'; info.className = 'text-xs text-center mb-2 text-emerald-300';
            } else {
                b.textContent = 'Partager le devis PDF'; b.disabled = false; b.className = b.className.replace(' opacity-40', '');
                info.textContent = 'Devis ' + APP.pdf.numero + ' prêt en PDF.'; info.className = 'text-xs text-center mb-2 text-emerald-300';
            }
        }
        function actionBarrePdf() { if (APP.pdf) partagerPdf(); else creerPdf(); }

        function dessinerRecap() {
            var z = document.getElementById('fin');
            if (!z) return;
            var l = APP.lignes || [], c = calculerDevis(APP.fiche, devisPourPdf()), m = manques();
            var h = '<div class="p-4 sm:p-5 rounded-2xl border-2 border-gold-500/60 bg-gold-500/5">' +
                    '<p class="text-white text-lg font-semibold">Vérifiez le devis</p><p class="text-slate-400 text-xs mb-3">Touchez un texte ou un prix pour le corriger.</p><div class="space-y-2">';
            for (var i = 0; i < l.length; i++) {
                h += '<div class="p-3 rounded-xl bg-obsidian/60 border border-white/10">' +
                        '<input value="' + esc(l[i].designation) + '" oninput="majLigne(' + i + ',\'designation\',this.value)" class="w-full bg-transparent text-white text-sm focus:outline-none border-b border-white/10 pb-1">' +
                        '<div class="grid grid-cols-12 gap-2 mt-2 items-center text-sm">' +
                            '<input value="' + esc(String(l[i].qte).replace('.', ',')) + '" inputmode="decimal" oninput="majLigne(' + i + ',\'qte\',this.value)" aria-label="Quantité" class="col-span-3 ' + CHAMP + ' !py-1.5">' +
                            '<span class="col-span-2 text-slate-400 text-xs">' + esc(l[i].unite) + '</span>' +
                            '<input value="' + esc(String(l[i].pu).replace('.', ',')) + '" inputmode="decimal" placeholder="Prix HT" oninput="majLigne(' + i + ',\'pu\',this.value)" aria-label="Prix HT" class="col-span-4 ' + CHAMP + ' !py-1.5">' +
                            '<span id="tot-' + i + '" class="col-span-2 text-right text-slate-300 text-xs">' + euros(nombre(l[i].qte) * nombre(l[i].pu)) + '</span>' +
                            '<button type="button" onclick="supprimerLigne(' + i + ')" aria-label="Supprimer" class="col-span-1 text-red-300 text-lg leading-none">×</button>' +
                        '</div></div>';
            }
            h += '</div><button type="button" onclick="ajouterLigne()" class="mt-2 w-full px-4 py-2.5 rounded-lg border border-white/15 text-slate-200 text-sm">+ Ajouter une ligne</button>';
            h += '<div id="totaux" class="mt-4 p-4 rounded-xl bg-obsidian/70 border border-white/10 text-sm">' + totauxHtml(c) + '</div>';
            h += '<p id="manque" class="mt-3 text-xs text-red-300">' + (m.length ? 'Pour créer le PDF, il manque : ' + esc(m.join(', ')) + '.' : '') + '</p>' +
                 '<button type="button" id="creer" onclick="creerPdf()" ' + (m.length ? 'disabled ' : '') + 'class="mt-2 w-full px-6 py-4 rounded-full text-base font-bold text-black bg-gradient-to-r from-gold-400 to-gold-600 ' + (m.length ? 'opacity-40 cursor-not-allowed' : '') + '">Créer le PDF</button>' +
                 '<div id="resultat" class="' + (APP.pdf ? '' : 'hidden ') + 'mt-3 space-y-2">' +
                    '<p class="text-emerald-300 text-sm">Devis prêt en PDF. Relisez-le avant de l\'envoyer.</p>' +
                    '<button type="button" onclick="partagerPdf()" class="w-full px-6 py-4 rounded-full text-base font-bold text-black bg-emerald-400">Partager le devis (WhatsApp, Mail, SMS…)</button>' +
                    '<button type="button" onclick="telechargerPdf()" class="w-full px-6 py-3 rounded-full text-sm font-semibold text-emerald-300 border border-emerald-400/50">Enregistrer le PDF</button>' +
                    '<button type="button" onclick="ouvrirPdf()" class="w-full px-6 py-3 rounded-full text-sm text-slate-300 border border-white/15">Voir le PDF</button>' +
                 '</div>' +
                 '<button type="button" onclick="nouveauDevis()" class="mt-4 w-full text-sm text-slate-400 underline">Commencer un nouveau devis</button></div>';
            z.innerHTML = h;
        }

        function totauxHtml(c) {
            return '<div class="flex justify-between text-slate-300"><span>Total HT</span><span>' + euros(c.ht) + '</span></div>' +
                   (c.franchise ? '<div class="text-slate-400 text-xs mt-1">TVA non applicable (art. 293 B du CGI)</div>'
                                : '<div class="flex justify-between text-slate-300 mt-1"><span>TVA ' + String(c.taux).replace('.', ',') + ' %</span><span>' + euros(c.tva) + '</span></div>') +
                   '<div class="flex justify-between text-white font-bold mt-2 pt-2 border-t border-white/10"><span>Total TTC</span><span>' + euros(c.ttc) + '</span></div>';
        }

        function majLigne(i, champ, v) {
            if (!APP.lignes[i]) return;
            APP.lignes[i][champ] = v;
            APP.pdf = null;
            var t = document.getElementById('tot-' + i);
            if (t) t.textContent = euros(nombre(APP.lignes[i].qte) * nombre(APP.lignes[i].pu));
            document.getElementById('totaux').innerHTML = totauxHtml(calculerDevis(APP.fiche, devisPourPdf()));
            var m = manques(), b = document.getElementById('creer');
            b.disabled = m.length > 0;
            b.classList.toggle('opacity-40', m.length > 0);
            b.classList.toggle('cursor-not-allowed', m.length > 0);
            document.getElementById('manque').textContent = m.length ? 'Pour créer le PDF, il manque : ' + m.join(', ') + '.' : '';
            document.getElementById('resultat').classList.add('hidden');
            majBarrePdf();
            sauverBrouillon();
        }

        function ajouterLigne() { APP.lignes.push({ designation: '', qte: '1', unite: 'u', pu: '' }); APP.pdf = null; sauverBrouillon(); dessinerRecap(); majBarrePdf(); }
        function supprimerLigne(i) { APP.lignes.splice(i, 1); APP.pdf = null; sauverBrouillon(); dessinerRecap(); majBarrePdf(); }

        function creerPdf() {
            if (manques().length) return;
            if (!window.jspdf || !window.jspdf.jsPDF) { document.getElementById('manque').textContent = "L'outil PDF ne s'est pas chargé : vérifiez votre connexion internet et rechargez la page."; return; }
            APP.pdf = genererPdfDevis(window.jspdf.jsPDF, APP.fiche, devisPourPdf(), new Date());
            APP.pdfFichier = null;
            try { APP.pdfFichier = new File([APP.pdf.doc.output('blob')], 'Devis_' + APP.pdf.numero + '.pdf', { type: 'application/pdf' }); } catch (e) {}
            var r = document.getElementById('resultat');
            r.classList.remove('hidden');
            majBarrePdf();
            if (r.scrollIntoView) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        function partagerPdf() {
            if (!APP.pdf) return;
            var f = APP.pdfFichier;
            try {
                if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
                    navigator.share({ files: [f], title: 'Devis ' + APP.pdf.numero, text: 'Bonjour, voici votre devis.' }).catch(function () {});
                    return;
                }
            } catch (e) {}
            telechargerPdf();
        }
        function telechargerPdf() { if (APP.pdf) APP.pdf.doc.save('Devis_' + APP.pdf.numero + '.pdf'); }
        function ouvrirPdf() { if (APP.pdf) window.open(APP.pdf.doc.output('bloburl'), '_blank'); }

        demarrer();
    </script>
</body>
</html>
